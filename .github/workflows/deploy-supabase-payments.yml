name: Deploy Supabase payment functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions and configure secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_API_URL: ${{ secrets.ASAAS_API_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$ASAAS_API_KEY"
          test -n "$ASAAS_WEBHOOK_TOKEN"
          : "${ASAAS_API_URL:=https://api-sandbox.asaas.com/v3}"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            ASAAS_API_KEY="$ASAAS_API_KEY" \
            ASAAS_WEBHOOK_TOKEN="$ASAAS_WEBHOOK_TOKEN" \
            ASAAS_API_URL="$ASAAS_API_URL" \
            ASAAS_SINGLE_AD_PRICE="10.00" \
            ASAAS_MONTHLY_PLAN_PRICE="59.00"
          supabase functions deploy asaas-create-payment --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy asaas-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
