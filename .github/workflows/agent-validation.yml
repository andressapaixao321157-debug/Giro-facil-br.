name: Validate intelligent agents
on:
  push:
    branches: [main, feature/giro-agentes-inteligentes, campaign/500-parceiros-fundadores, fix/acquisition-event-semantics-20261125]
    paths:
      - "index.html"
      - "kit-parceiro-fundador.html"
      - "campanha-parceiros-fundadores.html"
      - "docs/campanha-500-parceiros-fundadores.md"
      - "supabase/functions/giro-assistant/**"
      - "supabase/functions/admin-dashboard/**"
      - "supabase/functions/asaas-create-payment/**"
      - "supabase/functions/asaas-webhook/**"
      - "supabase/migrations/**"
      - "scripts/smoke-test.js"
      - "package.json"
      - ".github/workflows/agent-validation.yml"
  workflow_dispatch:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate assistant source structure
        run: |
          test -s supabase/functions/giro-assistant/index.ts
          grep -q 'const agentProfiles' supabase/functions/giro-assistant/index.ts
          grep -q 'profile?.papel !== "admin"' supabase/functions/giro-assistant/index.ts
      - name: Run marketplace regression and agent tests
        run: npm test
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: giro-facil-br-debug-keystore-v1
      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK without publishing
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='br.com.girofacil.app'"
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: giro-facil-br-agent-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
