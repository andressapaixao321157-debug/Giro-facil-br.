name: Listing privacy regression
on:
  push:
    branches: ["fix/listing-privacy-current-main"]
    paths:
      - "index.html"
      - "scripts/smoke-test.js"
      - "supabase/migrations/**"
      - ".github/workflows/listing-privacy-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/smoke-test.js"
      - "supabase/migrations/**"
      - ".github/workflows/listing-privacy-validation.yml"
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run marketplace and privacy regression tests
        run: npm test
