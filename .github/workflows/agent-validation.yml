name: Validate intelligent agents
on:
  push:
    branches: [main, feature/giro-agentes-inteligentes]
    paths:
      - "index.html"
      - "supabase/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - "vendor/**"
      - "android/**"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "supabase/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - "vendor/**"
      - "android/**"
  workflow_dispatch:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Validate assistant source structure
        run: |
          test -s supabase/functions/giro-assistant/index.ts
          grep -q 'const agentProfiles' supabase/functions/giro-assistant/index.ts
          grep -q 'profile?.papel !== "admin"' supabase/functions/giro-assistant/index.ts
      - name: Run marketplace regression and agent tests
        run: npm test
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: giro-facil-br-debug-keystore-v2
      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          KEYSTORE_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEYSTORE_SHA256"
          echo "GIRO_DEBUG_CERT_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
          echo "Persistent debug keystore certificate SHA-256: $KEYSTORE_SHA256"
      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK without publishing
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT_SHA256"
          if [ "$APK_CERT_SHA256" != "$GIRO_DEBUG_CERT_SHA256" ]; then
            echo "::error::APK signature does not match the persistent debug keystore."
            exit 1
          fi
          echo "APK signing certificate matches the persistent debug keystore."
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='br.com.girofacil.app'"
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: giro-facil-br-agent-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
