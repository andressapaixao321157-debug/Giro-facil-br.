name: Deploy national acquisition CRM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/admin-dashboard/**"
      - ".github/workflows/deploy-acquisition.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Validate Supabase deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Configure SUPABASE_PROJECT_REF in GitHub Actions secrets."; exit 1; }
      - name: Apply database migrations and deploy CRM function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-dashboard --project-ref "$SUPABASE_PROJECT_REF"
